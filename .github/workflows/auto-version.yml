name: Auto Version

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  auto-version:
    # Skip if this push came from a version bump (our own [skip ci] commits)
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history → standard-version reads commits since last tag
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version (standard-version)
        run: |
          # --dry-run first to see if there's anything to bump
          OUTPUT=$(npx standard-version --dry-run 2>&1 || true)
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q "bumping version"; then
            echo "✅ New commits detected — bumping version..."
            npx standard-version
          else
            echo "ℹ️  No feature/fix commits since last tag — skipping bump"
          fi

      - name: Push new tag
        run: |
          # Push both the commit (with [skip ci]) and the new tag
          git push --follow-tags origin master
