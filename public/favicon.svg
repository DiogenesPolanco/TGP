<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Gradiente principal - Azul corporativo a Cyan tecnológico -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>

    <!-- Gradiente para el elemento central -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>

    <!-- Sombra sutil -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fondo circular con borde sutil -->
  <circle cx="16" cy="16" r="15" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>

  <!-- Escudo exterior - representa gobernanza y protección -->
  <path d="M16 4 
           C16 4, 8 6, 6 8 
           C6 8, 6 18, 6 18 
           C6 22, 10 26, 16 28 
           C22 26, 26 22, 26 18 
           C26 18, 26 8, 26 8 
           C24 6, 16 4, 16 4Z" 
        fill="url(#shieldGrad)" 
        filter="url(#shadow)"/>

  <!-- Borde interior del escudo -->
  <path d="M16 6 
           C16 6, 10 7.5, 8 9 
           C8 9, 8 17, 8 17 
           C8 20.5, 11.5 24, 16 25.5 
           C20.5 24, 24 20.5, 24 17 
           C24 17, 24 9, 24 9 
           C22 7.5, 16 6, 16 6Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.25)" 
        stroke-width="0.5"/>

  <!-- Hexágono central - representa arquitectura tecnológica y estructura -->
  <path d="M16 9.5 
           L20.5 12.1 
           L20.5 17.3 
           L16 19.9 
           L11.5 17.3 
           L11.5 12.1Z" 
        fill="rgba(255,255,255,0.12)" 
        stroke="rgba(255,255,255,0.4)" 
        stroke-width="0.5"/>

  <!-- Nodo central - representa monitoreo y control -->
  <circle cx="16" cy="15.5" r="2.2" fill="url(#coreGrad)" stroke="rgba(255,255,255,0.6)" stroke-width="0.5"/>

  <!-- Líneas de conexión desde el nodo central - representan integración de sistemas -->
  <line x1="16" y1="13.3" x2="16" y2="9.5" stroke="rgba(255,255,255,0.5)" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="17.9" y1="16.6" x2="20.5" y2="17.3" stroke="rgba(255,255,255,0.5)" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="14.1" y1="16.6" x2="11.5" y2="17.3" stroke="rgba(255,255,255,0.5)" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Pequeños nodos periféricos - representan aplicaciones/entidades gestionadas -->
  <circle cx="16" cy="9.5" r="1" fill="#38bdf8"/>
  <circle cx="20.5" cy="17.3" r="1" fill="#38bdf8"/>
  <circle cx="11.5" cy="17.3" r="1" fill="#38bdf8"/>

  <!-- Indicador de estado/pulso en el nodo central -->
  <circle cx="16" cy="15.5" r="1.2" fill="none" stroke="#7dd3fc" stroke-width="0.3" opacity="0.6">
    <animate attributeName="r" values="1.2;2.5;1.2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Checkmark sutil en el nodo central - representa gobernanza y cumplimiento -->
  <path d="M15.2 15.5 L15.7 16.1 L16.8 14.9" 
        fill="none" 
        stroke="rgba(255,255,255,0.9)" 
        stroke-width="0.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>